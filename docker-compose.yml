services:
  postgres:
    image: postgres:15-alpine
    container_name: job-scraper-db
    environment:
      POSTGRES_DB: job_market_data
      POSTGRES_USER: jobscraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-users.sql:/docker-entrypoint-initdb.d/02-init-users.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscraper -d job_market_data"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  job-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-scraper-app
    env_file: .env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: job_market_data
      DB_USER: jobscraper
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: production
      PYTHONPATH: /app/src
      DISPLAY: :99
      SCRAPER_HEADLESS: "true"
      SCRAPER_BATCH_SIZE: "25"
      MAX_JOBS_PER_SESSION: "1000"
      AUTOMATION_MODE: "true"
      AUTO_SOLVE_CAPTCHA: "true"
    volumes:
      - ./data:/app/data
      - scraper_logs:/app/data/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.0'
        reservations:
          memory: 3G
          cpus: '1.5'

  adminer:
    image: adminer:latest
    container_name: job-scraper-adminer
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - scraper-network

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: job-scraper-monitor
    ports:
      - "127.0.0.1:9002:9000"
    volumes:
      - ./data:/app/data:ro
      - scraper_logs:/app/logs:ro
    networks:
      - scraper-network

volumes:
  postgres_data:
    driver: local
  scraper_logs:
    driver: local

networks:
  scraper-network:
    driver: bridge
