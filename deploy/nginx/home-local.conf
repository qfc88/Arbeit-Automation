#
# Home-server nginx (runs inside Docker, fronts the scraper-network services)
#
# Two listening surfaces:
#   - Public surface (:80): reached only from the VPS WireGuard peer (10.8.0.1).
#     Admin paths (/admin, /adminer, /monitor) are refused here so a VPS
#     compromise cannot pivot to admin tools.
#   - Admin surface (:80 on the ZeroTier interface): reached from ZT clients
#     (10.147.x.x). Admin paths are allowed here, protected by basic auth.
#
# Because nginx inside Docker cannot distinguish the ZT IP from the VPS IP
# on its own, we split by Host header: the VPS proxies with Host
# jobs.yourdomain, ZT clients hit admin.home (resolved via /etc/hosts on
# the admin laptop). The server_name blocks below enforce the split.
#

upstream scraper_backend     { server job-scraper:8000; }
upstream monitor_backend     { server monitor:9000; }
upstream adminer_backend     { server adminer:8080; }

# Placeholders enabled in Pha 3:
# upstream api_backend       { server api:8001; }
# upstream frontend_backend  { server frontend:3000; }
# upstream ml_backend        { server ml-inference:8002; }

# ---------- Public surface ---------------------------------------------------
# Serves end users via the VPS tunnel. Admin paths are blocked.
server {
    listen 80;
    server_name jobs.yourdomain _;

    # Block admin/internal paths on the public surface
    location ~ ^/(admin|adminer|monitor|ml|internal) {
        return 404;
    }

    # Public API (uncomment when src/api lands)
    # location /api/ {
    #     proxy_pass http://api_backend/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Public job portal — temporary fallback to monitor until frontend lands
    location / {
        # proxy_pass http://frontend_backend;
        proxy_pass http://monitor_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- Admin surface ----------------------------------------------------
# Serves admins over ZeroTier. Basic auth is layered on top of ZT membership
# (defence in depth — ZT IP alone is not an auth factor).
server {
    listen 80;
    server_name admin.home;

    auth_basic "Deutsch DE admin";
    auth_basic_user_file /etc/nginx/htpasswd;

    location /adminer/ {
        proxy_pass http://adminer_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /monitor/ {
        proxy_pass http://monitor_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Admin dashboard (uncomment when src/api admin routes land)
    # location /admin/ {
    #     proxy_pass http://api_backend/admin/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    location / {
        return 200 "Deutsch DE admin surface. Use /adminer/ or /monitor/.\n";
        add_header Content-Type text/plain;
    }
}
