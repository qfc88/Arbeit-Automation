#
# VPS public reverse proxy — jobs.yourdomain
#
# Flow:
#   Internet -> VPS:443 (TLS) -> WireGuard tunnel -> home nginx (10.8.0.2:80)
#
# Admin paths are refused at this layer so they cannot be reached from the
# public Internet at all; admins go through ZeroTier directly to the home
# server instead.
#

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name jobs.yourdomain;
    return 301 https://$host$request_uri;
}

# Rate-limit zone — keyed by client IP, 10 req/s burst 20
limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobs.yourdomain;

    ssl_certificate     /etc/letsencrypt/live/jobs.yourdomain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.yourdomain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body size (job search queries are small)
    client_max_body_size 2m;

    # Refuse admin paths outright — public must never reach them
    location ~ ^/(admin|adminer|monitor|ml|internal) {
        return 404;
    }

    # Public API (FastAPI behind home nginx)
    location /api/ {
        limit_req zone=public_api burst=20 nodelay;
        proxy_pass http://10.8.0.2:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Public job portal (Next.js)
    location / {
        proxy_pass http://10.8.0.2:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
