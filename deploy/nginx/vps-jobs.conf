#
# VPS public reverse proxy — ism.repme.tech
#
# Traffic flow:
#   Browser → ism.repme.tech (VPS public IP)
#     → Nginx TLS termination
#       → Tailscale tunnel (100.121.93.93)
#         → ss1135 home server
#           ├── /api/* → FastAPI :8001
#           └── /*     → Next.js  :3000
#
# Setup on VPS:
#   1. Install Tailscale: curl -fsSL https://tailscale.com/install.sh | sh
#   2. tailscale up --accept-routes
#   3. Verify: ping 100.121.93.93
#   4. Install certbot: apt install certbot python3-certbot-nginx -y
#   5. Copy this file to /etc/nginx/sites-available/ism.repme.tech
#   6. ln -s /etc/nginx/sites-available/ism.repme.tech /etc/nginx/sites-enabled/
#   7. nginx -t && systemctl reload nginx
#   8. certbot --nginx -d ism.repme.tech
#

upstream home_api {
    server 100.121.93.93:8001;
    keepalive 16;
}

upstream home_frontend {
    server 100.121.93.93:3000;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ism.repme.tech;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Rate-limit zone — keyed by client IP, 10 req/s
limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ism.repme.tech;

    # --- SSL (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/ism.repme.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ism.repme.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 4m;

    # --- Basic Auth (protect entire site during testing) ---
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    # --- Block admin/internal paths from public internet ---
    location ~ ^/(admin|adminer|monitor|internal|ml/retrain|ml/predict-all) {
        return 403;
    }

    # --- API: FastAPI on ss1135:8001 via Tailscale ---
    location /api/ {
        limit_req zone=public_api burst=20 nodelay;

        proxy_pass http://home_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # --- Frontend: Next.js on ss1135:3000 via Tailscale ---
    location / {
        proxy_pass http://home_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support (Next.js HMR / dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
