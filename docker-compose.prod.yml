#
# Production overlay for home-server deployment (Ryzen 5700X + 16GB + RTX 2060).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this overlay does vs. the base compose:
#   - Every service port is rebound to 127.0.0.1 so nothing is reachable from
#     the LAN unless it goes through nginx (which is the single public ingress).
#   - nginx listens on 0.0.0.0 and fronts scraper/admin/monitor; public traffic
#     reaches nginx via the WireGuard tunnel from the VPS; admin traffic
#     reaches nginx via the ZeroTier interface.
#   - ml-inference uses the NVIDIA runtime (requires nvidia-container-toolkit).
#   - All services get restart: unless-stopped.
#
# Pha 3 services (api, frontend, ml-inference) are wired in. The baseline ML
# image is CPU-only; swap to a CUDA base image when fine-tuning gbert-base
# (Pha 3.4 step 3) and uncomment the nvidia runtime block.
#

services:
  postgres:
    restart: unless-stopped

  job-scraper:
    restart: unless-stopped
    environment:
      SCRAPER_USE_PARALLEL: "true"
      SCRAPER_CONCURRENCY: "6"
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}

  adminer:
    restart: unless-stopped

  monitor:
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: job-scraper-nginx
    depends_on:
      - job-scraper
      - monitor
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/home-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - scraper-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: job-scraper-api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: job_market_data
      DB_USER: jobscraper
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_JWT_SECRET: ${API_JWT_SECRET}
      API_CORS_ORIGINS: "http://frontend:3000,http://admin.home,https://jobs.yourdomain"
      TWOCAPTCHA_API_KEY: ${TWOCAPTCHA_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: job-scraper-frontend
    environment:
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - scraper-network
    restart: unless-stopped

  ml-inference:
    build:
      context: .
      dockerfile: src/ml/Dockerfile
      args:
        BASE: nvidia/cuda:12.4.1-runtime-ubuntu22.04
    container_name: job-scraper-ml
    environment:
      ML_MODEL_PATH: /app/src/ml/models/gbert_category
      ML_RELOAD_TOKEN: ${ML_RELOAD_TOKEN:-}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/ml:/app/data/ml:ro
    networks:
      - scraper-network
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
